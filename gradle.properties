# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# No org.gradle.java.home here. It used to pin this build to one absolute
# Windows path, so CI could not build at all and any contributor whose
# JDK 17 sits elsewhere got a cryptic failure. Set JAVA_HOME instead, or
# pick the Gradle JDK in Android Studio under Build Tools, Gradle.

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Suppress compileSdk warning for AGP 8.2.0
android.suppressUnsupportedCompileSdk=35

# R8 Full Mode — aggressive dead-code elimination
android.enableR8.fullMode=true

# Kotlin
kotlin.code.style=official
